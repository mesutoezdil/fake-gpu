site_name: Fake GPU
site_description: Run AMD GPU orchestration and monitoring demos without physical GPUs.
site_url: https://mesutoezdil.github.io/fake-gpu/
repo_url: https://github.com/mesutoezdil/fake-gpu
repo_name: mesutoezdil/fake-gpu
docs_dir: tmp/docs-source
site_dir: tmp/docs-site
use_directory_urls: true
theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home:
      - Overview: index.md
      - Quick start: docs/getting-started.md
      - Choose a demo: docs/demos.md
      - Troubleshooting: docs/troubleshooting.md
  - Guides:
      - Overview: docs/guides/index.md
      - Allocation:
          - AMD DRA driver: docs/guides/dra.md
          - AMD device plugin: docs/guides/device-plugin.md
          - Same-GPU partition allocation: docs/guides/partition-allocation.md
      - Platforms:
          - Optional CUSE and libdrm: docs/guides/driver-mock.md
          - OpenShift Local (restricted-v2): docs/guides/openshift-local.md
      - Telemetry: docs/guides/telemetry.md
  - Demos:
      - Presenter guide: demo/README.md
      - Workloads:
          - Tiny LLM: demo/llm/README.md
          - DRA allocation: demo/dra/README.md
          - Multiple GPUs: demo/multi-gpu/README.md
          - Same-GPU partitions: demo/partition-allocation/README.md
          - Spur batch scheduling: demo/spur/README.md
      - Tasks:
          - Allocation and release: demo/allocation/README.md
          - Failure injection: demo/faults/README.md
          - Prometheus and Grafana: demo/telemetry/README.md
          - Virtual partition controls: demo/partitioning/README.md
          - Switching GPU profiles: demo/profiles/README.md
  - Reference:
      - Architecture: docs/reference/architecture.md
      - How it works: docs/reference/how-it-works.md
      - GPU profiles: docs/reference/profiles.md
      - Simulation depth by area: docs/reference/simulation-depth.md
  - Contributing:
      - Testing: docs/contributing/testing.md
      - Documentation site: docs/contributing/docs-site.md
validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn
    anchors: warn
