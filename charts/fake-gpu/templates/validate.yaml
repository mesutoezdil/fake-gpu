{{- /*
Reject value combinations that would double-allocate GPUs, discover the real
/sys, or start a topology the profile cannot provide. Renders nothing.
*/ -}}
{{- $partition := include "fake-gpu.partition" . -}}
{{- if not (has $partition (list "SPX" "DPX")) -}}
{{- fail "gpu.partition must be SPX or DPX" -}}
{{- end -}}
{{- if and (eq $partition "DPX") (ne .Values.gpu.profile "mi300x") -}}
{{- fail "schedulable DPX/NPS2 partitions require gpu.profile=mi300x" -}}
{{- end -}}
{{- if and .Values.dra.enabled .Values.devicePlugin.enabled -}}
{{- fail "DRA and the device plugin cannot allocate the same GPUs: set devicePlugin.enabled=false" -}}
{{- end -}}
{{- if and .Values.monitoring.enabled (not .Values.metricsExporter.enabled) -}}
{{- fail "monitoring.enabled requires metricsExporter.enabled=true" -}}
{{- end -}}
{{- if and .Values.dra.enabled (ne .Values.dra.mockSysPath (printf "%s/sys" .Values.mockRootDir)) -}}
{{- fail "dra.mockSysPath must equal mockRootDir + /sys" -}}
{{- end -}}
{{- if and .Values.dra.enabled (ne (toJson .Values.nodeSelector) (toJson .Values.dra.kubeletPlugin.nodeSelector)) -}}
{{- fail "dra.kubeletPlugin.nodeSelector must match nodeSelector so the driver runs only on mock nodes" -}}
{{- end -}}
