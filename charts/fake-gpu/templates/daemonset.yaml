{{- $partition := .Values.gpu.partition | default "SPX" -}}
{{- if not (has $partition (list "SPX" "DPX")) -}}
{{- fail "gpu.partition must be SPX or DPX" -}}
{{- end -}}
{{- if and (eq $partition "DPX") (ne .Values.gpu.profile "mi300x") -}}
{{- fail "schedulable DPX/NPS2 partitions require gpu.profile=mi300x" -}}
{{- end -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "fake-gpu.fullname" . }}
  labels:
    {{- include "fake-gpu.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "fake-gpu.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fake-gpu.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: node-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - node-agent
            - --config=/etc/fake-gpu/config.yaml
            - --partition={{ .Values.gpu.partition | default "SPX" }}
            - --root={{ .Values.mockRootDir }}
            - --api=:{{ .Values.api.port }}
            {{- if .Values.driverMock.enabled }}
            - --device-backend=cuse
            {{- end }}
            {{- if .Values.kernelLog.enabled }}
            - --kernel-log=/dev/kmsg
            {{- end }}
          ports:
            - name: api
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          {{- if .Values.driverMock.enabled }}
          readinessProbe:
            httpGet:
              path: /api/gpus
              port: api
            periodSeconds: 2
          {{- end }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: config
              mountPath: /etc/fake-gpu/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: mock-root
              mountPath: {{ .Values.mockRootDir }}
              mountPropagation: Bidirectional
            - name: host-dev
              mountPath: /dev
              {{- if .Values.driverMock.enabled }}
              mountPropagation: Bidirectional
              {{- end }}
            - name: host-cdi
              mountPath: /etc/cdi
            - name: host-cdi-run
              mountPath: /var/run/cdi
        {{- if .Values.nri.enabled }}
        - name: nri-plugin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - nri-plugin
            - --overlay-host={{ .Values.mockRootDir }}
            - --overlay-mount=/opt/fake-gpu
            - --release-namespace={{ .Release.Namespace }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: nri-socket
              mountPath: /var/run/nri
            - name: mock-root
              mountPath: {{ .Values.mockRootDir }}
              readOnly: true
        {{- end }}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: {{ include "fake-gpu.fullname" . }}
        - name: mock-root
          hostPath:
            path: {{ .Values.mockRootDir }}
            type: DirectoryOrCreate
        - name: host-dev
          hostPath:
            path: /dev
        - name: host-cdi
          hostPath:
            path: /etc/cdi
            type: DirectoryOrCreate
        - name: host-cdi-run
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        {{- if .Values.nri.enabled }}
        - name: nri-socket
          hostPath:
            path: /var/run/nri
        {{- end }}
