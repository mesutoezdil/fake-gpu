{{- /* Agent API and dashboard; a NodePort when the kind quick start maps it to the host. */ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fake-gpu.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fake-gpu.labels" . | nindent 4 }}
spec:
  {{- if .Values.dashboard.enabled }}
  type: NodePort
  {{- end }}
  selector:
    {{- include "fake-gpu.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.api.port }}
      {{- if .Values.dashboard.enabled }}
      nodePort: {{ .Values.dashboard.nodePort }}
      {{- end }}
      targetPort: api
      protocol: TCP
