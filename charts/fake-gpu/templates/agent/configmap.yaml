{{- /* The selected GPU profile, mounted into the agent as config.yaml. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fake-gpu.fullname" . }}
  labels:
    {{- include "fake-gpu.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- .Files.Get (printf "profiles/%s.yaml" .Values.gpu.profile) | nindent 4 }}
