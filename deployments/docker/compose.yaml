# Single-machine mode: the mock agent without Kubernetes.
#   docker compose -f deployments/docker/compose.yaml up -d --build
# The agent runs unprivileged and touches nothing on the host. Mock state
# lives in the "state" volume; mount it into other containers to read it.
services:
  fake-gpu:
    build: ../..
    image: fake-gpu:local
    command: ["node-agent", "--config", "/etc/fake-gpu/profiles/${GPU_PROFILE:-mi300x}.yaml"]
    ports:
      - "127.0.0.1:${FAKE_GPU_PORT:-8080}:8080"
    volumes:
      - state:/var/lib/fake-gpu
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      retries: 15

  # Stand-in for a workload: reads the mock GPUs through the shared volume.
  amd-smi:
    image: fake-gpu:local
    profiles: [tools]
    entrypoint: ["amd-smi"]
    command: ["monitor"]
    volumes:
      - state:/var/lib/fake-gpu:ro
    depends_on:
      fake-gpu:
        condition: service_healthy

volumes:
  state:
