  - {index: 3, pci_bdf: "0000:63:00.0", drm_render_minor: 131, unique_id: "0x6210000000000004", xgmi_device_id: "0x0004", uuid: "GPU-amd-mi210-0000-0000-0000000000003"}
  - {index: 4, pci_bdf: "0000:83:00.0", drm_render_minor: 132, unique_id: "0x6210000000000005", xgmi_device_id: "0x0005", uuid: "GPU-amd-mi210-0000-0000-0000000000004"}
