# Spur controller for the demo: one partition over every managed node, the
# backfill scheduler on a one-second tick, and no accounting database.
cluster_name = "fake-gpu-spur"

[controller]
node_id = 1

[scheduler]
plugin = "backfill"
interval_secs = 1

# Callers are not checked; the operator still signs its requests with the key.
[auth]
plugin = "none"
jwt_key_file = "/etc/spur-auth/jwt-key"

[accounting]
database_url = ""

[[partitions]]
name = "default"
default = true
state = "UP"
nodes = "ALL"
