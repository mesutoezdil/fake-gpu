# The demo's single configuration: demo/setup.sh renders the kind cluster's
# host ports from it and installs the chart with it, so both always agree.
# Host ports are fixed when the cluster is created; edit them before that.

# Allocator: exactly one of the two. DRA is the default.
dra:
  enabled: true
devicePlugin:
  enabled: false

gpu:
  profile: mi300x

# Host ports kind maps to the dashboard and Grafana node ports below.
kind:
  mockDashboardPort: 8080
  grafanaPort: 3000

dashboard:
  enabled: true
  nodePort: 30080

metricsExporter:
  enabled: true

monitoring:
  enabled: true
  grafana:
    enabled: true
    nodePort: 30300
    adminPassword: amdmock
