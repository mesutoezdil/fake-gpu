name: dra-e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stack: [source-upstream, published]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Character-device restart regression
        run: |
          CGO_ENABLED=0 go test -c -o /tmp/kfd-restart.test ./pkg/gpu/kfd
          sudo /tmp/kfd-restart.test -test.run TestRenderDeviceNodesAfterUncleanShutdown -test.v
      - uses: azure/setup-helm@v4
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          kubectl_version: v1.37.0
          ignore_failed_clean: true
          cluster_name: amd-dra-test
          node_image: ${{ matrix.stack == 'published' && 'ghcr.io/mesutoezdil/amd-mock-kind-node:0.1.0' || 'kindest/node:v1.37.0' }}
          config: deploy/kind-node/kind-config.yaml
          wait: 120s
      - name: Registry credentials for the node
        run: scripts/ci/node-registry-auth.sh amd-dra-test
      - name: Build and deploy patched mock
        if: matrix.stack == 'source-upstream'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/node-agent ./cmd/node-agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/nri-plugin ./cmd/nri-plugin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/amd-smi ./cmd/amd-smi
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/fakegpuctl ./cmd/fakegpuctl
          make -C pkg/mocksmi
          make -C pkg/hipshim
          docker build -f Dockerfile.prebuilt -t fake-gpu:dra-test .
          kind load docker-image fake-gpu:dra-test --name amd-dra-test
          helm install fake-gpu charts/fake-gpu \
            --set monitoring.enabled=false --set metricsExporter.enabled=false \
            -n amd-mock --create-namespace \
            --set image.repository=fake-gpu --set image.tag=dra-test \
            --set image.pullPolicy=Never --set devicePlugin.enabled=false \
            --set gpu.profile=mi300x --set dra.enabled=true \
            --set dra.image.repository=docker.io/rocm/k8s-gpu-dra-driver \
            --set dra.image.tag=v1.0.0
          kubectl -n amd-mock rollout status ds/fake-gpu --timeout=120s
      - name: Install published quickstart artifacts
        if: matrix.stack == 'published'
        run: |
          helm install fake-gpu oci://ghcr.io/mesutoezdil/fake-gpu \
            --version 0.1.0 -n amd-mock --create-namespace
          kubectl -n amd-mock rollout status ds/fake-gpu --timeout=120s
      - name: Dashboard available automatically on host
        run: python3 test/e2e/demo/dashboard.py
      - name: Grafana available automatically on host
        if: matrix.stack == 'published'
        run: python3 test/e2e/demo/grafana.py
      - name: DRA discovery and allocation
        env:
          KEEP: "1"
          INSTALL_DRIVER: "0"
          DRA_NS: amd-mock
        run: |
          test/e2e/dra/run.sh
          kubectl delete namespace amd-dra-test --wait=true --timeout=120s
          python3 test/e2e/dra/lifecycle.py
      - name: DRA capacity, shared containers and PCIe constraints
        run: |
          set -o pipefail
          mkdir -p artifacts
          python3 -u test/e2e/dra/constraints.py | tee artifacts/dra-constraints.log
      - name: Default DRA Tiny LLM and virtual partition demo
        run: MODE=dra python3 test/e2e/demo/workloads.py
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          kubectl get pods,resourceclaims -A -o wide > artifacts/workloads.txt 2>&1 || true
          kubectl get resourceslices -o yaml > artifacts/resourceslices.yaml 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > artifacts/events.txt 2>&1 || true
          kubectl -n amd-mock logs ds/fake-gpu-dra-kubeletplugin \
            --all-containers --tail=200 > artifacts/driver.log 2>&1 || true
          kubectl -n amd-mock describe pods > artifacts/pod-descriptions.txt 2>&1 || true
          kubectl -n amd-mock logs ds/fake-gpu-dra-kubeletplugin \
            -c driver-init > artifacts/driver-init.log 2>&1 || true
          kind export logs artifacts/kind --name amd-dra-test || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dra-e2e-diagnostics-${{ matrix.stack }}
          path: artifacts/
