# Go tests and the single-machine Docker mode. No cluster, so it runs on every PR.
name: unit-and-docker

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - run: test -z "$(gofmt -l cmd pkg)"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Device node tests that need root for mknod
        run: |
          go test -c -o /tmp/node-agent.test ./cmd/node-agent
          go test -c -o /tmp/mockdriver.test ./pkg/mockdriver
          sudo /tmp/node-agent.test -test.v -test.run 'TestCreateDeviceNodes|TestMakedev'
          sudo /tmp/mockdriver.test -test.v
      - run: test/container/docker/run.sh
      - run: test/container/hipshim/run.sh
      - run: test/container/hipshim/live.sh
      - run: test/container/hipcpu/run.sh
