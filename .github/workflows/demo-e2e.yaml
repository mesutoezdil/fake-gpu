name: demo-e2e
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  demos:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        allocator: [dra, device-plugin]
    env:
      CONTAINER_RUNTIME: docker
      CLUSTER_NAME: amd-presenter-test
      DEMO_CONTEXT: kind-amd-presenter-test
      ALLOCATOR: ${{ matrix.allocator }}
      DEMO_CONFIG: /tmp/amd-demo-values.yaml
      KIND_NODE_REGISTRY_AUTH: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "$TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.33.0
          kubectl_version: v1.37.0
      - name: Port and dashboard chart contracts
        run: test/chart/demo.sh
      - name: Fresh published setup with both dashboards enabled
        run: |
          cp demo/config.yaml "$DEMO_CONFIG"
          if [ "$ALLOCATOR" = device-plugin ]; then
            python3 -c 'import os,pathlib; p=pathlib.Path(os.environ["DEMO_CONFIG"]); p.write_text(p.read_text().replace("dra:\n  enabled: true", "dra:\n  enabled: false").replace("devicePlugin:\n  enabled: false", "devicePlugin:\n  enabled: true"))'
          fi
          ./demo/setup.sh --config "$DEMO_CONFIG"
      - name: Grafana and all presenter commands
        run: |
          python3 test/e2e/demo/grafana.py
          python3 test/e2e/demo/presenter.py
      - name: Disable and restore both dashboards
        run: |
          source scripts/release.env
          helm upgrade fake-gpu oci://ghcr.io/mesutoezdil/fake-gpu --version "$CHART_VERSION" \
            -n amd-mock --reuse-values --set dashboard.enabled=false \
            --set monitoring.grafana.enabled=false --wait --timeout 3m
          python3 test/e2e/demo/dashboards_disabled.py
          ./demo/setup.sh --skip-cluster --config "$DEMO_CONFIG"
          python3 test/e2e/demo/dashboard.py
          python3 test/e2e/demo/grafana.py
      - name: Diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          kubectl get pods -A -o wide > artifacts/pods.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > artifacts/events.txt 2>&1 || true
          kubectl -n amd-mock logs deploy/fake-gpu-grafana > artifacts/grafana.log 2>&1 || true
          kubectl -n amd-mock logs deploy/fake-gpu-prometheus > artifacts/prometheus.log 2>&1 || true
          kind export logs artifacts/kind --name "$CLUSTER_NAME" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demos-${{ matrix.allocator }}
          path: artifacts/
