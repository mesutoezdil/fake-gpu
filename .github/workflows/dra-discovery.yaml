# Runs AMD's DRA driver discovery code against every GPU profile.
# Fast (no cluster), so it runs on every PR that touches code. The full
# kind test is test/e2e/dra/run.sh.
name: dra-discovery

on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'mkdocs.yml', 'scripts/docs/**', 'LICENSE', 'LICENSES/**', 'NOTICE', '.github/workflows/docs-site.yaml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false
      - uses: azure/setup-helm@v4
      - name: Chart configuration contracts
        run: test/chart/dra.sh
      - name: Renderer contract tests
        run: go test ./pkg/gpu/kfd
      - name: AMD DRA driver discovery, all profiles
        run: test/container/dra_discovery/run.sh
      - name: AMD DRA driver discovery, MI300X DPX/NPS2
        run: PARTITION_MODE=DPX test/container/dra_discovery/run.sh mi300x
