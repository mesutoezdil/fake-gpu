{{- /* kind cluster config for the demo: host ports for the dashboard and
Grafana, and the node labels the mock and AMD's operator select on. */ -}}
{{- $dashboard := include "kind.dashboard" . -}}
{{- $grafana := include "kind.grafana" . -}}
{{- if and $dashboard $grafana (eq (int .Values.kind.mockDashboardPort) (int .Values.kind.grafanaPort)) -}}
{{- fail "mock dashboard and Grafana host ports must differ" -}}
{{- end -}}
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    {{- if or $dashboard $grafana }}
    extraPortMappings:
      {{- if $dashboard }}
      {{- include "kind.port" (dict "node" .Values.dashboard.nodePort "host" .Values.kind.mockDashboardPort) | nindent 6 }}
      {{- end }}
      {{- if $grafana }}
      {{- include "kind.port" (dict "node" .Values.monitoring.grafana.nodePort "host" .Values.kind.grafanaPort) | nindent 6 }}
      {{- end }}
    {{- end }}
    labels:
      feature.node.kubernetes.io/amd-gpu: "true"
      fake-gpu.amd.com/type: sgpu
